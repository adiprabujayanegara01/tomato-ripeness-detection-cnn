<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Prediksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center text-danger">Riwayat Hasil Prediksi</h2>

        <div class="d-flex justify-content-end my-3">
            <form method="get" class="d-flex">
                <label class="me-2">Urutkan berdasarkan:</label>
                <select name="sort_by" class="form-select" onchange="this.form.submit()">
                    <option value="time_desc" {% if sort_by == 'time_desc' %}selected{% endif %}>Waktu (Terbaru)</option>
                    <option value="time_asc" {% if sort_by == 'time_asc' %}selected{% endif %}>Waktu (Terlama)</option>
                    <option value="label" {% if sort_by == 'label' %}selected{% endif %}>Kategori Kematangan</option>
                </select>
            </form>
        </div>

        {% if history %}
            <div class="row">
                {% for item in history %}
                <div class="col-md-4 mb-4">
                    <div class="card shadow p-3">
                        <img src="{{ url_for('static', filename='uploads/' + item.filename) }}" class="img-fluid rounded mb-3">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><strong>File:</strong> {{ item.filename }}</li>
                            <li class="list-group-item"><strong>Label:</strong> {{ item.label.replace('_', ' ') }}</li>
                            <li class="list-group-item"><strong>Waktu:</strong> {{ item.timestamp }}</li>
                        </ul>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center text-muted">Belum ada data prediksi yang tersimpan.</p>
        {% endif %}

        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
